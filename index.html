<style>
:root{--bg:#071322;--card:#0e2137;--card2:#102740;--line:#274159;--lime:#c4ff22;--blue:#38a8ef;--txt:#f3f7ff;--muted:#92a8b9}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;color:var(--txt);background:linear-gradient(160deg,#071322,#081b30 66%,#061122);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.page{max-width:950px;margin:auto;padding-bottom:103px}.head{position:relative;min-height:213px;padding:23px 19px 14px;overflow:hidden;background:radial-gradient(ellipse at 77% 2%,#12406a 0%,#0c2742 36%,#061321 79%);border-bottom:1px solid #31506a}
.mast{display:flex;justify-content:space-between;gap:12px;align-items:start;position:relative;z-index:1}.brand{font-weight:950;font-style:italic;letter-spacing:-1.4px;font-size:clamp(26px,5vw,40px);line-height:1.1}.brand b{color:var(--lime)}.smallcap{font-size:10px;letter-spacing:2px;color:#a7bcce;font-weight:800;margin-top:6px}.avatar{border-radius:50%;background:#173650;border:1px solid #507189;color:#d9efff;padding:9px 12px}
.ball{width:151px;height:151px;border-radius:50%;position:absolute;right:5%;top:36px;transform:rotate(-20deg);background:radial-gradient(circle at 31% 26%,#e5ff78,#acda03 50%,#629507 85%);box-shadow:0 0 55px #72cf2040,0 15px 30px #0008}.ball:before,.ball:after{content:"";position:absolute;inset:-4px 45%;border-radius:50%;border:5px solid #eef6d0;transform:rotate(27deg)}.ball:after{transform:rotate(-27deg)}.hero-label{font-size:12px;color:#98cde9;position:relative;z-index:1;margin-top:65px;font-weight:700;letter-spacing:2px}.hero-title{font-size:16px;max-width:55%;position:relative;z-index:1;margin-top:4px;color:#e2f2fa}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 14px 4px;scrollbar-width:none}.tabs button{white-space:nowrap;background:#142d45;color:#a9c9d7;border:1px solid #31516a;border-radius:20px;padding:9px 13px;font-size:12px;font-weight:750}.tabs button.active{color:#071322;background:var(--lime);border-color:var(--lime)}
.notice{margin:12px 15px 4px;padding:9px 12px;background:#162d42;border:1px solid #3a5b6e;border-radius:12px;color:#b9dbed;font-size:12px}
.content{padding:12px 15px}.eyebrow{font-size:11px;font-weight:850;letter-spacing:2px;color:var(--lime);text-transform:uppercase}h1{font-size:26px;line-height:1.1;margin:7px 0 16px}h2{font-size:18px;margin:0}h3{font-size:16px;margin:5px 0 10px}.sub{color:var(--muted);font-size:12px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border-radius:16px;border:1px solid #284762;background:linear-gradient(140deg,#102841,#0a1d32);padding:15px;min-width:0}.full{grid-column:1/-1}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.link{border:0;background:transparent;color:var(--lime);font-size:12px;font-weight:700;padding:4px}.kpis{display:flex;justify-content:space-between;gap:10px;margin:14px 0}.kpis>*{flex:1;min-width:0}.num{display:block;font-weight:900;font-size:25px;color:white;line-height:1.1}.num.lime{color:var(--lime)}.kpis small{font-size:10px;color:var(--muted)}.playername{font-size:18px;font-weight:850;margin:5px 0}.rankrow{display:grid;grid-template-columns:28px minmax(0,1fr) 55px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #284158}.rankrow:last-child{border-bottom:0}.rankno{font-weight:900;color:#83b0ce}.rankname{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.points{text-align:right;font-weight:900;color:var(--lime)}.track{height:4px;border-radius:4px;background:#34506b;margin-top:5px;overflow:hidden}.fill{height:100%;background:var(--lime)}.statline{display:flex;justify-content:space-between;margin:7px 0;font-size:13px;border-bottom:1px solid #254158;padding-bottom:8px}.statline b{color:white}.positive{color:var(--lime)}.score{color:#bce7ff;font-weight:850;font-size:19px;letter-spacing:1px}.match-card{padding:11px;background:#0a192b;border:1px solid #304e63;border-radius:10px;margin:8px 0}.award-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.award{border-radius:11px;background:#091a2b;border:1px solid #37536c;padding:12px 5px;text-align:center}.award span{font-size:25px;display:block}.award strong{font-size:11px;display:block;margin-top:5px}.locked{opacity:.37}.bar{height:9px;border-radius:10px;background:#2b4053;overflow:hidden;margin-top:5px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#42a6fc,var(--lime));border-radius:10px}.btn{border:0;background:var(--lime);color:#092032;border-radius:11px;padding:12px 14px;font-weight:850}.btn.alt{background:#183a54;color:#d8f0ff;border:1px solid #385a71}.btn.danger{background:#472533;color:#ffd0db}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.actions button{font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#071624f5;border-top:1px solid #31536b;display:flex;justify-content:center;padding:9px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom))}.bottom-inner{max-width:560px;width:100%;display:flex;justify-content:space-around;align-items:center;gap:5px}.nav{background:none;border:0;color:#9bb8cb;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:50px}.nav span{font-size:24px;line-height:24px}.nav.active{color:var(--lime)}.plus{background:var(--lime);color:#091b27;border:none;border-radius:50%;width:47px;height:47px;font-weight:900;font-size:28px}.modal-bg{position:fixed;inset:0;z-index:9;background:#000b;display:flex;align-items:flex-end;justify-content:center}.modal{max-height:92dvh;overflow-y:auto;background:#0c2338;border:1px solid #3b586f;border-radius:22px 22px 0 0;width:min(100%,620px);padding:20px 18px calc(24px + env(safe-area-inset-bottom))}.modal-top{display:flex;justify-content:space-between;align-items:center}.close{background:#1e3e54;color:#fff;border:none;border-radius:50%;width:35px;height:35px;font-size:24px}.field{display:block;width:100%;margin:4px 0 13px;padding:12px;border:1px solid #456175;background:#071929;color:#fff;border-radius:9px;color-scheme:dark}label{display:block;color:#bed4e3;font-size:12px;font-weight:700;margin-top:12px}.hint{font-size:11px;color:#9cb3c5}input[type=file]{font-size:12px}.empty{text-align:center;color:#9fc0d4;padding:23px 10px;font-size:13px}.pill{display:inline-flex;background:#203e4f;color:#bdf3fe;border-radius:22px;padding:5px 9px;font-size:11px}.chart{height:82px;width:100%;display:flex;align-items:end;gap:3px;margin-top:10px}.chart i{display:block;flex:1;background:linear-gradient(0deg,#1b6195,#c5ff22);border-radius:3px 3px 0 0}.subtle-link{color:var(--blue)}.alert{color:#f5cfa0}.notice b{color:#fff}
@media(min-width:690px){.head{border-radius:0 0 18px 18px}.ball{right:15%}.content{padding:17px}.grid{gap:15px}}@media(max-width:430px){.ball{width:128px;height:128px;right:3%;top:58px}.brand{font-size:29px}.hero-label{margin-top:72px}.grid{gap:9px}.card{padding:12px}.num{font-size:21px}.rankname{font-size:12px}.tabs{padding-left:11px}}
</style></head><body>
<div class="page">
<header class="head"><div class="mast"><div class="brand">SPORTS <b>HUB</b></div><button class="avatar" id="settingsBtn" aria-label="Configurações e backup">⚙</button></div></header>
<nav class="tabs" id="tabs"></nav><div class="notice" id="banner"></div><main class="content" id="content"></main>
</div><nav class="bottom" aria-label="Navegação principal"><div class="bottom-inner"><button class="nav active" data-main="inicio"><span>⌂</span>Início</button><button class="nav" data-main="partidas"><span>▤</span>Partidas</button><button class="plus" id="addBtn" aria-label="Adicionar registro">+</button><button class="nav" data-main="estatisticas"><span>▥</span>Stats</button><button class="nav" data-main="jogadores"><span>♧</span>Jogadores</button></div></nav>
<div id="modalRoot"></div>
<script>
(function(){
'use strict';
var KEY='sports-hub-web-preview-v01';var current='inicio',module='tennis',editing=null;
var today=function(){return new Date().toISOString().slice(0,10)};
var uid=function(){return (Date.now().toString(36)+Math.random().toString(36).slice(2,8))};
var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var initial=function(){return {version:1,demo:false,players:[],matches:[],training:[]}};
var demonstration=function(){return {version:1,demo:true,players:[{id:'p1',name:'Antônio'},{id:'p2',name:'Pedro'},{id:'p3',name:'Lucas'},{id:'p4',name:'João'}],matches:[{id:'m1',a:'p1',b:'p2',date:'2026-11-06',score:'6-4, 6-3',surface:'Rápida'},{id:'m2',a:'p3',b:'p4',date:'2026-11-07',score:'7-5, 6-4',surface:'Saibro'},{id:'m3',a:'p2',b:'p3',date:'2026-11-08',score:'6-2, 6-4',surface:'Rápida'}],training:[{id:'t1',date:'2026-11-08',sport:'Tênis',minutes:60}]}};
var state;try{state=JSON.parse(localStorage.getItem(KEY)||'null')||demonstration()}catch(e){state=demonstration();alert('O navegador bloqueou o armazenamento local. Exporte seus dados antes de fechar.')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Falha ao salvar. Exporte seus registros.')}}
function parseScore(txt){
 var xs=String(txt).trim().split(/\s*,\s*/);if(xs.length<2||xs.length>3)throw Error('Informe 2 ou 3 sets, separados por vírgula.');
 var aw=0,bw=0;xs.forEach(function(s){var m=/^([0-7])\s*[-x]\s*([0-7])$/.exec(s),a,b;if(!m)throw Error('Formato de set inválido: '+s);a=+m[1];b=+m[2];if(!((a===6&&b<=4)||(b===6&&a<=4)||(a===7&&(b===5||b===6))||(b===7&&(a===5||a===6))))throw Error('Placar de set inválido: '+s);if(a>b)aw++;else bw++});
 if(aw!==2&&bw!==2)throw Error('É necessário definir o vencedor por 2 sets.');
 if(xs.length!==aw+bw||((xs.length===3)&&(aw!==2&&bw!==2)))throw Error('Resultado incompleto.');
 return aw>bw?'a':'b';
}
function compute(){
 var rows={},rank=[],ordered=state.matches.slice().sort(function(a,b){return a.date.localeCompare(b.date)||(a.id||'').localeCompare(b.id||'')});
 state.players.forEach(function(p){rows[p.id]={id:p.id,name:p.name,elo:1500,wins:0,games:0,setsWon:0,setsLost:0,streak:0,bestStreak:0,history:[1500],surfaces:{},opponents:{}}});
 ordered.forEach(function(m){var a=rows[m.a],b=rows[m.b];if(!a||!b||a===b)return;var win;try{win=parseScore(m.score)}catch(e){return}
 var ea=1/(1+Math.pow(10,(b.elo-a.elo)/400)),delta=Math.round(32*((win==='a'?1:0)-ea));
 a.elo+=delta;b.elo-=delta;a.history.push(a.elo);b.history.push(b.elo);
 a.games++;b.games++;a.wins+=win==='a'?1:0;b.wins+=win==='b'?1:0;
 a.streak=win==='a'?a.streak+1:0;b.streak=win==='b'?b.streak+1:0;a.bestStreak=Math.max(a.bestStreak,a.streak);b.bestStreak=Math.max(b.bestStreak,b.streak);
 m.score.split(',').forEach(function(s){var x=s.trim().split('-').map(Number);a.setsWon+=x[0]>x[1]?1:0;a.setsLost+=x[0]<x[1]?1:0;b.setsWon+=x[1]>x[0]?1:0;b.setsLost+=x[1]<x[0]?1:0});
 [a,b].forEach(function(p){var surf=p.surfaces[m.surface]||(p.surfaces[m.surface]={games:0,wins:0});surf.games++;if((p===a&&win==='a')||(p===b&&win==='b'))surf.wins++});
 [a,b].forEach(function(p){var opp=p===a?b:a;var obj=p.opponents[opp.id]||(p.opponents[opp.id]={games:0,wins:0});obj.games++;if((p===a&&win==='a')||(p===b&&win==='b'))obj.wins++})
 });
 rank=Object.keys(rows).map(function(x){return rows[x]}).sort(function(a,b){return b.elo-a.elo||a.name.localeCompare(b.name)});
 return {rows:rows,rank:rank,ordered:ordered};
}
function nameOf(id){var p=state.players.find(function(x){return x.id===id});return p?p.name:'Jogador removido'}
function statsOf(p){return p?'<div class="kpis"><div><span class="num lime">'+p.elo+'</span><small>PONTOS ELO</small></div><div><span class="num">'+p.wins+'</span><small>VITÓRIAS</small></div><div><span class="num">'+(p.games?Math.round(p.wins/p.games*100)+'%':'—')+'</span><small>APROVEITAMENTO</small></div></div>':'<p class="sub">Cadastre jogadores para começar.</p>'}
function ranking(d){return d.rank.length?d.rank.map(function(p,i){return '<div class="rankrow"><span class="rankno">'+(i+1)+'</span><span class="rankname">'+esc(p.name)+'</span><span class="points">'+p.elo.toLocaleString('pt-BR')+'</span></div>'}).join(''):'<div class="empty">Sem jogadores cadastrados</div>'}
function matchRows(d,limit){var arr=d.ordered.slice().reverse();if(limit)arr=arr.slice(0,limit);return arr.length?arr.map(function(m){return '<div class="match-card"><div class="sub">'+esc(m.date)+' • '+esc(m.surface)+'</div><strong>'+esc(nameOf(m.a))+' × '+esc(nameOf(m.b))+'</strong><div class="score">'+esc(m.score)+'</div><div class="actions"><button class="btn alt" data-edit="'+esc(m.id)+'">Editar</button><button class="btn danger" data-delete="'+esc(m.id)+'">Excluir</button></div></div>'}).join(''):'<div class="empty">Nenhuma partida registrada.</div>'}
function awards(p){return [{label:'Primeira vitória',target:1,icon:'🏅'},{label:'5 vitórias',target:5,icon:'🏆'},{label:'10 vitórias',target:10,icon:'👑'},{label:'3 seguidas',target:3,icon:'🔥'},{label:'20 partidas',target:20,icon:'🎯'},{label:'ELO 1600',target:1600,icon:'⭐',elo:true}].map(function(x){var yes=p&&(x.elo?p.elo>=x.target:(x.label.indexOf('seguidas')>=0?p.bestStreak>=x.target:(x.label.indexOf('partidas')>=0?p.games>=x.target:p.wins>=x.target)));return '<div class="award '+(yes?'':'locked')+'"><span>'+x.icon+'</span><strong>'+x.label+'</strong><small class="sub">'+(yes?'Conquistado':'Bloqueado')+'</small></div>'}).join('')}
function chart(p){var arr=p&&p.history||[];if(!arr.length)return '';return '<div class="chart" aria-label="Evolução ELO">'+arr.map(function(v){return '<i style="height:'+Math.max(7,Math.min(100,15+(v-1400)/3))+'%"></i>'}).join('')+'</div>'}
function intro(title,label){return '<div class="eyebrow">'+label+'</div><h1>'+title+'</h1>'}
function home(d){var p=d.rows[state.players[0]&&state.players[0].id],last=d.ordered[d.ordered.length-1],place=d.rank.findIndex(function(x){return p&&x.id===p.id})+1,hour=new Date().getHours(),greeting=hour<12?'Bom dia':hour<18?'Boa tarde':'Boa noite';
 return '<section class="greeting"><span>'+greeting+',</span><h1>'+esc(p?p.name:'jogador')+'</h1></section>'+
 '<button class="elo-hero" data-go="tennis" aria-label="Ver ranking ELO"><span class="place">'+(place||'—')+'<sup>º</sup></span><span class="elo-number">'+(p?p.elo.toLocaleString('pt-BR'):'1.500')+'<small>ELO</small></span></button>'+
 '<section class="recent"><div class="heading"><h2>Última partida</h2><button class="link" data-nav="partidas">Ver todas ›</button></div>'+(last?'<div class="score-row"><span>'+esc(nameOf(last.a))+'<br>'+esc(nameOf(last.b))+'</span><strong>'+esc(last.score)+'</strong></div>':'<p class="sub">Nenhuma partida registrada.</p>')+'</section>'+
 '<button class="btn primary-action" id="newMatch">+ &nbsp; Registrar partida</button>'+
 '<p class="home-hint">Ranking, Scout, conquistas e análises em Stats.</p>'}
function render(){
 var d=compute(),p=d.rows[state.players[0]&&state.players[0].id],html='';
 document.getElementById('tabs').innerHTML=current==='estatisticas'&&module!=='overview'?'<button data-go="overview">‹ Todas as áreas</button>':'';
 document.getElementById('banner').innerHTML=state.demo?'<b>DEMONSTRAÇÃO</b> · Dados ilustrativos <button class="link" id="cleanBtn">Usar meus dados</button>':'<b>DADOS LOCAIS</b> · Salvos neste aparelho <button class="link" id="backupBtn">Backup</button>';
 document.querySelectorAll('.nav').forEach(function(b){b.classList.toggle('active',b.dataset.main===current)});
 if(current==='partidas'){html=intro('Partidas','TENNIS RANK')+'<button class="btn" id="newMatch">+ Registrar partida</button><div style="margin-top:12px">'+matchRows(d)+'</div>'}
 else if(current==='jogadores'){html=intro('Jogadores','TENNIS RANK')+'<button class="btn" id="newPlayer">+ Jogador</button><div style="margin-top:12px">'+state.players.map(function(x){return '<div class="card" style="margin-bottom:8px"><strong>'+esc(x.name)+'</strong><div class="sub">ELO: '+(d.rows[x.id]?d.rows[x.id].elo:1500)+'</div></div>'}).join('')+'</div>'}
 else if(current==='estatisticas'){
 if(module==='overview'){html=intro('Seu jogo','ESTATÍSTICAS')+'<div class="module-list">'+[['tennis','Tennis Rank','Classificação e ELO'],['scout','Scout','Desempenho e confrontos'],['trophy','Trophy Room','Conquistas e marcos'],['wrapped','Sports Wrapped','Sua retrospectiva'],['performance','Performance Lab','Treinos e atividade']].map(function(x){return '<button data-go="'+x[0]+'"><strong>'+x[1]+'</strong><small>'+x[2]+'</small><span>›</span></button>'}).join('')+'</div>'}
 else if(module==='scout'){html=intro('Scout','ANÁLISE ESPORTIVA')+(p?'<div class="grid"><div class="card">'+statsOf(p)+chart(p)+'</div><div class="card"><h2>Por superfície</h2>'+Object.keys(p.surfaces).map(function(s){var o=p.surfaces[s];return '<div class="statline"><span>'+esc(s)+'</span><b>'+o.wins+'/'+o.games+' vitórias</b></div>'}).join('')+'</div><div class="card full"><h2>Confrontos diretos</h2>'+Object.keys(p.opponents).map(function(k){var x=p.opponents[k];return '<div class="statline"><span>'+esc(nameOf(k))+'</span><b>'+x.wins+' V / '+(x.games-x.wins)+' D</b></div>'}).join('')+'</div></div>':'<div class="empty">Cadastre um jogador.</div>')}
 else if(module==='trophy'){html=intro('Trophy Room','CONQUISTAS')+'<div class="card"><h2>Conquistas de '+esc(p?p.name:'seu perfil')+'</h2><div class="award-grid" style="margin-top:14px">'+awards(p)+'</div></div>'}
 else if(module==='wrapped'){html=intro('Sports Wrapped','RETROSPECTIVA')+'<div class="grid"><div class="card"><h2>Partidas</h2><span class="num lime">'+d.ordered.length+'</span></div><div class="card"><h2>Treinos</h2><span class="num lime">'+state.training.length+'</span></div><div class="card full"><h2>Seu histórico</h2>'+statsOf(p)+'<p class="sub">Relatórios mensais e anuais completos serão adicionados em futuras versões.</p></div></div>'}
 else if(module==='performance'){html=intro('Performance Lab','ATIVIDADE E TREINO')+'<div class="grid"><div class="card"><h2>Treinos</h2><span class="num">'+state.training.length+'</span></div><div class="card"><h2>Minutos</h2><span class="num">'+state.training.reduce(function(a,b){return a+Number(b.minutes||0)},0)+'</span></div><div class="card full"><button class="btn" id="newTraining">+ Registrar treino</button>'+state.training.slice().reverse().map(function(t){return '<div class="statline"><span>'+esc(t.sport)+' • '+esc(t.date)+'</span><b>'+Number(t.minutes)+' min</b></div>'}).join('')+'</div></div>'}
 else html=intro('Ranking','TENNIS RANK')+'<div class="ranking-list"><div class="rank-heading"><span>#</span><span>Jogador</span><span>ELO</span></div>'+ranking(d)+'</div><div class="actions"><button class="btn" id="newMatch">+ Partida</button><button class="btn alt" id="newPlayer">+ Jogador</button></div>'
 }else html=home(d);
 document.getElementById('content').innerHTML=html;
 document.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){module=b.dataset.go;current='estatisticas';render()}});
 document.querySelectorAll('[data-nav]').forEach(function(b){b.onclick=function(){current=b.dataset.nav;render()}});
 document.querySelectorAll('[data-edit]').forEach(function(b){b.onclick=function(){openMatch(b.dataset.edit)}});
 document.querySelectorAll('[data-delete]').forEach(function(b){b.onclick=function(){if(confirm('Excluir esta partida e recalcular o ranking?')){state.matches=state.matches.filter(function(x){return x.id!==b.dataset.delete});save();render()}}});
 [['newMatch',function(){openMatch()}],['newPlayer',openPlayer],['newTraining',openTraining],['backupBtn',settings],['cleanBtn',function(){if(confirm('Substituir a demonstração por uma base vazia?')){state=initial();save();render()}}]].forEach(function(x){var el=document.getElementById(x[0]);if(el)el.onclick=x[1]});
}
function openModal(title,html,fn){var el=document.getElementById('modalRoot');el.innerHTML='<div class="modal-bg"><section class="modal"><div class="modal-top"><h2>'+title+'</h2><button class="close" id="closeModal">×</button></div>'+html+'</section></div>';document.getElementById('closeModal').onclick=closeModal;var form=document.getElementById('entryForm');if(form)form.onsubmit=function(ev){ev.preventDefault();fn(new FormData(form))}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function opts(chosen){return state.players.map(function(p){return '<option value="'+esc(p.id)+'" '+(p.id===chosen?'selected':'')+'>'+esc(p.name)+'</option>'}).join('')}
function openMatch(id){if(state.players.length<2){alert('Cadastre pelo menos dois jogadores.');openPlayer();return}
 var m=state.matches.find(function(x){return x.id===id})||{a:state.players[0].id,b:state.players[1].id,date:today(),score:'6-4, 6-3',surface:'Rápida'};
 openModal(id?'Editar partida':'Registrar partida','<form id="entryForm"><label>Jogador 1</label><select class="field" name="a">'+opts(m.a)+'</select><label>Jogador 2</label><select class="field" name="b">'+opts(m.b)+'</select><label>Placar por set</label><input class="field" name="score" required value="'+esc(m.score)+'" placeholder="6-4, 6-3"><div class="hint">O jogador 1 aparece primeiro em cada set. Versão 0.1: simples, melhor de 3 sets.</div><label>Data</label><input class="field" type="date" name="date" value="'+esc(m.date)+'" required><label>Superfície</label><select class="field" name="surface"><option '+(m.surface==='Rápida'?'selected':'')+'>Rápida</option><option '+(m.surface==='Saibro'?'selected':'')+'>Saibro</option><option '+(m.surface==='Grama'?'selected':'')+'>Grama</option></select><button class="btn" type="submit">Salvar partida</button></form>',function(f){try{var a=f.get('a'),b=f.get('b'),score=String(f.get('score'));if(a===b)throw Error('Os jogadores devem ser diferentes.');parseScore(score);var data={id:id||uid(),a:a,b:b,score:score,date:String(f.get('date')),surface:String(f.get('surface'))};if(id)state.matches=state.matches.map(function(x){return x.id===id?data:x});else state.matches.push(data);save();closeModal();current='partidas';render()}catch(e){alert(e.message)}})
}
function openPlayer(){openModal('Adicionar jogador','<form id="entryForm"><label>Nome</label><input class="field" name="name" required maxlength="60" placeholder="Nome do jogador"><button class="btn" type="submit">Cadastrar</button></form>',function(f){var name=String(f.get('name')).trim();if(!name){alert('Digite um nome.');return}if(state.players.some(function(p){return p.name.toLowerCase()===name.toLowerCase()})){alert('Esse nome já está cadastrado.');return}state.players.push({id:uid(),name:name});save();closeModal();render()})}
function openTraining(){openModal('Registrar treino','<form id="entryForm"><label>Modalidade</label><select class="field" name="sport"><option>Tênis</option><option>Musculação</option><option>Futebol</option><option>Outro</option></select><label>Data</label><input class="field" name="date" type="date" value="'+today()+'" required><label>Duração em minutos</label><input class="field" name="minutes" type="number" min="1" max="1440" value="60" required><button class="btn" type="submit">Salvar treino</button></form>',function(f){var m=Number(f.get('minutes'));if(!Number.isFinite(m)||m<1||m>1440)return alert('Duração inválida');state.training.push({id:uid(),sport:String(f.get('sport')),date:String(f.get('date')),minutes:m});save();closeModal();module='performance';current='estatisticas';render()})}
function settings(){openModal('Configurações e backup','<p class="sub">Versão web de teste. Os registros são salvos <b>neste navegador</b>, não em um servidor. Faça backup antes de limpar o Safari ou trocar de aparelho.</p><div class="actions"><button class="btn" id="exportBtn" type="button">Exportar backup JSON</button></div><label>Importar backup</label><input type="file" accept=".json,application/json" id="importFile" class="field"><p class="sub alert">Não há sincronização, contas, nuvem ou confirmação de partidas nesta versão.</p>',function(){});
 document.getElementById('exportBtn').onclick=function(){var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='sports-hub-backup-'+today()+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(url)},3000)};
 document.getElementById('importFile').onchange=function(ev){var file=ev.target.files[0];if(!file)return;file.text().then(function(txt){var x=JSON.parse(txt);if(!x||!Array.isArray(x.players)||!Array.isArray(x.matches)||!Array.isArray(x.training))throw Error('Backup inválido');if(!confirm('Substituir seus registros atuais pelo arquivo importado?'))return;state=x;save();closeModal();render()}).catch(function(e){alert('Erro ao importar: '+e.message)})}
}
document.querySelectorAll('[data-main]').forEach(function(b){b.onclick=function(){current=b.dataset.main;if(current==='estatisticas')module='overview';render()}});
document.getElementById('addBtn').onclick=function(){openModal('Adicionar registro','<div class="actions"><button class="btn" id="chooseMatch">Partida</button><button class="btn alt" id="choosePlayer">Jogador</button><button class="btn alt" id="chooseTraining">Treino</button></div>',function(){});document.getElementById('chooseMatch').onclick=function(){openMatch()};document.getElementById('choosePlayer').onclick=openPlayer;document.getElementById('chooseTraining').onclick=openTraining};
document.getElementById('settingsBtn').onclick=settings;
render();if('serviceWorker' in navigator && location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(function(){});
})();
</script></body></html>
